---
- name: Get stats
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    aap_hostname: "{{ lookup('ansible.builtin.env', 'TOWER_HOST') }}"
    aap_username: "{{ lookup('ansible.builtin.env', 'TOWER_USERNAME') }}"
    aap_password: "{{ lookup('ansible.builtin.env', 'TOWER_PASSWORD') }}"
    aap_validate_certs: "{{ lookup('ansible.builtin.env', 'TOWER_VERIFY_SSL') | default(false) }}"

  tasks:
    - name: Get metrics (Prometheus format)
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/controller/v2/metrics/"
        method: GET
        force_basic_auth: true
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        return_content: true
        validate_certs: "{{ aap_validate_certs | default(false) }}"
      register: r_metrics

    - name: Parse metrics from Prometheus format
      ansible.builtin.set_fact:
        metrics:
          system_version: "{{ r_metrics.content | regex_search('awx_system_info\\{.*tower_version=\"([^\"]+)\"', '\\1') | first | default('unknown') }}"
          organizations_total: "{{ r_metrics.content | regex_search('awx_organizations_total ([0-9.]+)', '\\1') | first | default(0) }}"
          users_total: "{{ r_metrics.content | regex_search('awx_users_total ([0-9.]+)', '\\1') | first | default(0) }}"
          teams_total: "{{ r_metrics.content | regex_search('awx_teams_total ([0-9.]+)', '\\1') | first | default(0) }}"
          inventories_total: "{{ r_metrics.content | regex_search('awx_inventories_total ([0-9.]+)', '\\1') | first | default(0) }}"
          projects_total: "{{ r_metrics.content | regex_search('awx_projects_total ([0-9.]+)', '\\1') | first | default(0) }}"
          job_templates_total: "{{ r_metrics.content | regex_search('awx_job_templates_total ([0-9.]+)', '\\1') | first | default(0) }}"
          workflow_templates_total: "{{ r_metrics.content | regex_search('awx_workflow_job_templates_total ([0-9.]+)', '\\1') | first | default(0) }}"
          hosts_all: "{{ r_metrics.content | regex_search('awx_hosts_total\\{type=\"all\"\\} ([0-9.]+)', '\\1') | first | default(0) }}"
          license_total: "{{ r_metrics.content | regex_search('awx_license_instance_total ([0-9.]+)', '\\1') | first | default(0) }}"
          license_free: "{{ r_metrics.content | regex_search('awx_license_instance_free ([0-9.]+)', '\\1') | first | default(0) }}"

    - name: Get users info
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/controller/v2/users/?format=json"
        method: GET
        force_basic_auth: true
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        return_content: true
        headers:
          Content-Type: application/json
        validate_certs: "{{ aap_validate_certs | default(false) }}"
      register: r_users

    - name: Remove users who have never logged in (null)
      ansible.builtin.set_fact:
        temp_user_list: "{{ temp_user_list | default([]) + [item['last_login']] }}"
      when: item['last_login'] is regex('[0-9]{4}-[0-9]{2}-[0-9]{2}(.*)')
      loop: "{{ r_users['json']['results'] }}"

    - name: Find active users (last 30 days)
      ansible.builtin.set_fact:
        active_users: "{{ active_users | default([]) + [item] }}"
      when: ((((item | regex_search('[0-9]{4}-[0-9]{2}-[0-9]{2}', '\\0') | first) | to_datetime('%Y-%m-%d')) - (ansible_facts['date_time']['date'] | to_datetime('%Y-%m-%d'))).days) >= -30
      loop: "{{ temp_user_list | default([]) }}"

    - name: Output statistics
      ansible.builtin.debug:
        msg:
          - "========== AAP Statistics =========="
          - "System version: {{ metrics.system_version }}"
          - "Number of active users (30 days): {{ active_users | default([]) | length }}"
          - "Number of total users: {{ metrics.users_total }}"
          - "Number of organizations: {{ metrics.organizations_total }}"
          - "Number of teams: {{ metrics.teams_total }}"
          - "Number of inventories: {{ metrics.inventories_total }}"
          - "Number of projects: {{ metrics.projects_total }}"
          - "Number of job templates: {{ metrics.job_templates_total }}"
          - "Number of workflows: {{ metrics.workflow_templates_total }}"
          - "Number of hosts (all): {{ metrics.hosts_all }}"
          - "License - Total instances: {{ metrics.license_total }}"
          - "License - Free instances: {{ metrics.license_free }}"
          - "License - Used instances: {{ metrics.license_total | float - metrics.license_free | float }}"
...
