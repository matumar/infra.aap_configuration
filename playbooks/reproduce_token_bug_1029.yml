---
- name: Reproduce token loss bug in infra.aap_configuration
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    aap_hostname: "{{ aap_hostname | default('https://10.205.212.145') }}"
    aap_validate_certs: "{{ aap_validate_certs | default(false) }}"
    env_token: "{{ CONTROLLER_OAUTH_TOKEN | default('') }}"

  tasks:
    - name: Check token is available
      ansible.builtin.debug:
        msg: "Token found: {{ env_token[:10] }}..."
      when: env_token | length > 0

    - name: Fail if no token
      ansible.builtin.fail:
        msg: "CONTROLLER_OAUTH_TOKEN variable is not set in Extra Variables!"
      when: env_token | length == 0

    # Шаг 1: НЕПРАВИЛЬНЫЙ способ - передача через vars
    - name: Try to use token via vars (WILL FAIL intermittently)
      vars:
        aap_token: "{{ env_token }}"
        controller_organizations:
          - name: "Bug Test Org"
            description: "Organization for testing token bug"
        controller_projects:
          - name: "Bug Test Project"
            organization: "Bug Test Org"
            scm_type: "git"
            scm_url: "https://github.com/ansible/ansible-tower-samples"
        controller_credentials:
          - name: "Bug Test Credential"
            credential_type: "Machine"
            organization: "Bug Test Org"
      include_role:
        name: "{{ item }}"
      loop:
        - controller_organizations  # БЕЗ префикса infra.aap_configuration
        - controller_projects
        - controller_credentials
      ignore_errors: true
      register: result_without_set_fact

    - name: Show result without set_fact
      ansible.builtin.debug:
        msg:
          - "========== Result WITHOUT set_fact =========="
          - "Failed: {{ result_without_set_fact.failed | default(false) }}"
          - "Changed: {{ result_without_set_fact.changed | default(false) }}"

    # Шаг 2: ПРАВИЛЬНЫЙ способ - через set_fact
    - name: Set token as fact (CORRECT WAY)
      ansible.builtin.set_fact:
        aap_token: "{{ env_token }}"
        controller_organizations:
          - name: "Bug Test Org Fixed"
            description: "Organization with set_fact workaround"
        controller_projects:
          - name: "Bug Test Project Fixed"
            organization: "Bug Test Org Fixed"
            scm_type: "git"
            scm_url: "https://github.com/ansible/ansible-tower-samples"
        controller_credentials:
          - name: "Bug Test Credential Fixed"
            credential_type: "Machine"
            organization: "Bug Test Org Fixed"

    - name: Use roles with set_fact (should work)
      include_role:
        name: "{{ item }}"
      loop:
        - controller_organizations  # БЕЗ префикса
        - controller_projects
        - controller_credentials
      register: result_with_set_fact

    - name: Show result with set_fact
      ansible.builtin.debug:
        msg:
          - "========== Result WITH set_fact =========="
          - "Success!"
          - "Changed: {{ result_with_set_fact.changed | default(false) }}"
